<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>City Transit Map</title>
<meta name="description" content="Every scheduled bus, train and tram in a city, animated from the open GTFS timetable.">
<style>
  :root { --bg:#1e1e21; --fg:#fff; --dim:rgba(255,255,255,.62); --faint:rgba(255,255,255,.4);

              font:14px/1.35 -apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif;
              -webkit-user-select:none; user-select:none; overscroll-behavior:none; }

  canvas.drag { cursor:grabbing; }
  nav { position:fixed; top:0; left:0; right:0; height:calc(var(--tabs) + env(safe-area-inset-top)); padding-top:env(safe-area-inset-top);
        display:flex; gap:2px; align-items:center; z-index:6; padding-left:max(6px,env(safe-area-inset-left)); padding-right:max(8px,env(safe-area-inset-right));
        background:linear-gradient(rgba(20,20,22,.92),rgba(20,20,22,.7)); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
        border-bottom:1px solid var(--line); }
  #tabs { flex:1; min-width:0; display:flex; gap:4px; overflow-x:auto; scrollbar-width:none; padding:0 8px;
          -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 16px,#000 calc(100% - 16px),transparent 100%);
          mask-image:linear-gradient(90deg,transparent 0,#000 16px,#000 calc(100% - 16px),transparent 100%); }
  #tabs::-webkit-scrollbar { display:none; }
  #tabs button { flex:none; background:none; border:0; color:var(--dim); padding:7px 13px; border-radius:99px; font:inherit; font-weight:500; cursor:pointer; white-space:nowrap; }
  #tabs button:hover { color:var(--fg); background:rgba(255,255,255,.08); }
  #tabs button[aria-selected=true] { color:#111; background:#fff; }

  .navbtn:hover { color:var(--fg); background:rgba(255,255,255,.1); }

  .menu { position:fixed; top:calc(var(--tabs) + env(safe-area-inset-top) + 6px); right:max(8px,env(safe-area-inset-right)); width:min(640px,calc(100vw - 16px));
          max-height:calc(100vh - 110px); overflow:auto; background:rgba(22,22,25,.96); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
          border:1px solid var(--line); border-radius:14px; padding:8px; display:none; z-index:8; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:4px; }
  .menu.on { display:grid; }
  .menu button { text-align:left; background:none; border:0; border-radius:9px; padding:8px 10px; display:block; }
  .menu button b { display:block; font-weight:600; font-size:14px; }
  .menu button small { display:block; color:var(--dim); font-size:12px; margin-top:1px; }
  .menu button[aria-selected=true] { background:rgba(255,255,255,.16); }
  .title { position:fixed; left:max(16px,env(safe-area-inset-left)); top:calc(var(--tabs) + env(safe-area-inset-top) + 12px); pointer-events:none;
           text-shadow:0 1px 12px rgba(0,0,0,.75); max-width:62vw; }
  .title h1 { margin:0; font-weight:600; font-size:clamp(28px,5.5vw,48px); letter-spacing:-.02em; line-height:1.02; }
  .title .s1 { font-size:clamp(14px,2.2vw,19px); color:var(--dim); margin-top:6px; }
  .title .s2 { font-size:12px; color:var(--faint); margin-top:3px; }
  .clock { position:fixed; right:max(16px,env(safe-area-inset-right)); top:calc(var(--tabs) + env(safe-area-inset-top) + 12px); text-align:right;
           pointer-events:none; text-shadow:0 1px 12px rgba(0,0,0,.75); }
  .clock .t { font-size:clamp(28px,5vw,42px); font-variant-numeric:tabular-nums; font-weight:500; line-height:1; }
  .clock .n { font-size:13px; color:var(--dim); margin-top:6px; font-variant-numeric:tabular-nums; }
  .panel { position:fixed; left:50%; transform:translateX(-50%); bottom:max(26px,calc(env(safe-area-inset-bottom) + 14px));
           width:min(760px,calc(100vw - 24px)); background:var(--panel); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
           border:1px solid var(--line); border-radius:14px; padding:10px 12px; display:grid; gap:9px; }
  .row { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  button, select { font:inherit; color:var(--fg); background:rgba(255,255,255,.08); border:1px solid var(--line); border-radius:9px; padding:6px 11px; cursor:pointer; }
  button:hover, select:hover { background:rgba(255,255,255,.14); }
  button:focus-visible, select:focus-visible, input:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  #play { width:42px; height:34px; padding:0; font-size:15px; }
  input[type=range] { flex:1; min-width:120px; accent-color:var(--accent); height:28px; }
  .chip { display:inline-flex; align-items:center; gap:7px; padding:5px 11px 5px 9px; border-radius:99px; font-size:13px; }
  .chip[aria-pressed=false] { opacity:.45; }
  .chip i { width:14px; height:4px; border-radius:2px; display:inline-block; }
  label.loop { display:inline-flex; align-items:center; gap:6px; color:var(--dim); font-size:13px; cursor:pointer; }
  label.loop input { accent-color:var(--accent); }
  .spacer { flex:1; }
  .tip { position:fixed; pointer-events:none; background:rgba(12,12,14,.93); border:1px solid var(--line); border-radius:9px; padding:7px 10px;
         font-size:13px; max-width:260px; display:none; z-index:5; }
  .tip b { display:inline-block; min-width:1.6em; padding:1px 6px; border-radius:5px; margin-right:6px; color:#fff; text-align:center; }
  .tip small { display:block; color:var(--dim); margin-top:3px; }
  .foot { position:fixed; left:0; right:0; bottom:max(5px,env(safe-area-inset-bottom)); text-align:center; font-size:11px; color:var(--faint); pointer-events:none; padding:0 8px; }
  .foot a { color:inherit; pointer-events:auto; }
  #hide { width:42px; height:30px; padding:0; display:inline-flex; align-items:center; justify-content:center; }
  #restore { position:fixed; right:max(12px,env(safe-area-inset-right)); bottom:max(26px,calc(env(safe-area-inset-bottom) + 14px)); z-index:7; display:none;
             padding:7px 14px; border-radius:99px; font-size:13px; font-weight:500; background:rgba(24,24,27,.55); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
             color:var(--dim); opacity:.55; }
  #restore:hover { opacity:1; color:var(--fg); }
  .chip.heat { margin-left:auto; }
  .chip.heat[aria-pressed=true] { background:rgba(255,140,50,.22); border-color:rgba(255,170,90,.6); }
  .chip.heat i { background:linear-gradient(90deg,#282896,#2896be,#78c85a,#fabe32,#f53c32); }
  .legend { position:fixed; left:max(16px,env(safe-area-inset-left)); top:calc(var(--tabs) + env(safe-area-inset-top) + 124px); display:none; pointer-events:none;
            font-size:11px; color:var(--dim); text-shadow:0 1px 8px rgba(0,0,0,.8); }
  .legend.on { display:block; }
  .legend .bar { width:150px; height:7px; border-radius:4px; margin:4px 0 3px; background:linear-gradient(90deg,rgba(40,40,150,.5),#2896be,#78c85a,#fabe32,#f53c32); }
  .legend .lab { display:flex; justify-content:space-between; }
  body.min .legend { display:none !important; }
  body.min nav, body.min .title, body.min .clock, body.min .panel, body.min .zoom, body.min .menu { display:none !important; }
  body.min #restore { display:block; }
  body.min .foot { display:none; }
  .zoom { position:fixed; right:max(14px,env(safe-area-inset-right)); top:50%; transform:translateY(-50%); display:grid; gap:6px; }
  .zoom button { width:38px; height:38px; padding:0; font-size:20px; background:var(--panel); }
  #loading { position:fixed; inset:0; display:none; place-items:center; background:rgba(30,30,33,.72); z-index:4; color:var(--dim); font-size:16px; pointer-events:none; }
  #loading.on { display:grid; }
  #loading span::before { content:""; display:inline-block; width:14px; height:14px; margin-right:10px; vertical-align:-2px; border-radius:50%;
                          border:2px solid var(--faint); border-top-color:#fff; animation:spin .8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  @media (max-width:560px) { .navbtn { display:none; } .zoom { display:none; } .title .s2 { display:none; } }

<body>
<canvas id="map" aria-label="Animated map of every scheduled vehicle in the selected city"></canvas>
<nav><button class="navbtn" id="navL" aria-label="Scroll cities left">‹</button><div id="tabs" role="tablist" aria-label="Cities"></div>
  <button class="navbtn" id="navR" aria-label="Scroll cities right">›</button><button id="more" aria-expanded="false" aria-controls="menu">All cities</button></nav>
<div class="menu" id="menu" role="menu" aria-label="All cities"></div>
<div class="title"><h1 id="cname">&nbsp;</h1><div class="s1" id="csub"></div><div class="s2" id="cdate"></div></div>
<div class="clock"><div class="t" id="clock">08:00</div><div class="n" id="count"></div></div>
<div class="zoom"><button id="zin" aria-label="Zoom in">+</button><button id="zout" aria-label="Zoom out">−</button>
  <button id="zhome" aria-label="Reset view" style="font-size:15px">⌂</button></div>
<div class="legend" id="legend"><div>Vehicles running vs. this city's peak</div><div class="bar"></div><div class="lab"><span>fewer</span><span>peak</span></div></div>
<div class="tip" id="tip"></div>
<div class="panel">
  <div class="row">
    <button id="play" aria-label="Play or pause">❚❚</button>
    <input id="time" type="range" min="0" max="1" step="1" aria-label="Time of day">
    <select id="speed" aria-label="Playback speed">
      <option value="1">1×</option><option value="10">10×</option><option value="60">60×</option>
      <option value="120" selected>120×</option><option value="300">300×</option><option value="900">900×</option>
    </select>
  </div>
  <div class="row">
    <button class="chip" data-cls="1" aria-pressed="true"><i style="background:linear-gradient(90deg,#fff 0 33%,#bbb 33% 66%,#888 66%)"></i>Metro &amp; tram</button>
    <button class="chip" data-cls="2" aria-pressed="true"><i data-chipcol="rail"></i>Regional rail</button>
    <button class="chip" data-cls="0" aria-pressed="true"><i data-chipcol="bus"></i>Bus</button>
    <button class="chip heat" id="heat" aria-pressed="false" title="Density heatmap (D)"><i></i>Heatmap</button>
    <button id="hide" aria-label="Hide controls" title="Hide controls (H)"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:block;margin:auto"><path d="M3 5l4 4 4-4"/></svg></button>
  </div>
</div>
<button id="restore" aria-label="Show controls" title="Show controls (H)">Show</button>
<div id="loading"><span id="loadmsg">Loading…</span></div>
<div class="foot">basemap © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap contributors</a>, Overture Maps · <span id="credit">open GTFS timetables</span></div>

<script>
(() => {
const $ = id => document.getElementById(id);
const cv = $("map"), ctx = cv.getContext("2d");
const st = document.createElement("canvas"), sctx = st.getContext("2d");
let dpr = 1, vw = 0, vh = 0;
const view = { s: 1, x: 0, y: 0 };
const show = { 0: true, 1: true, 2: true };
const COL = { bus: { line: "rgba(99,115,168,.55)", chip: "#6373a8", tip: "#47548a" }, rail: { line: "rgba(86,150,140,.85)", chip: "#56968c", tip: "#3c7068" } };   // bus / regional-rail palette
let t = 8 * 3600, loopStart = t, playing = true, speed = 120, loop = false, scrubbed = false, curTz = null;
function tzOffset(tz) {                               // seconds east of UTC right now (DST-aware)
  try { const d = new Date(), p = new Intl.DateTimeFormat("en-US", { timeZone: tz, hourCycle: "h23", year: "numeric", month: "numeric", day: "numeric",
      hour: "numeric", minute: "numeric", second: "numeric" }).formatToParts(d); const g = k => +p.find(x => x.type === k).value;
    return Math.round((Date.UTC(g("year"), g("month") - 1, g("day"), g("hour"), g("minute"), g("second")) - Math.floor(d.getTime() / 1000) * 1000) / 1000); }
  catch (e) { return -new Date().getTimezoneOffset() * 60; }
}
function nowIn(tz) {                                  // seconds since local midnight in a city's time zone
  try { const p = new Intl.DateTimeFormat("en-GB", { timeZone: tz, hourCycle: "h23", hour: "2-digit", minute: "2-digit", second: "2-digit" }).formatToParts(new Date());
    const g = k => +p.find(x => x.type === k).value; return g("hour") * 3600 + g("minute") * 60 + g("second"); }
  catch (e) { const d = new Date(); return d.getHours() * 3600 + d.getMinutes() * 60 + d.getSeconds(); }
}
let staticDirty = true, stValid = false, stView = { s: 1, x: 0, y: 0 }, lastView = { s: 0, x: 0, y: 0 }, lastMove = 0, hover = -1, selected = -1, mouse = null;
let C = null;                                       // current city
let manifest = [], loadToken = 0;
const cache = new Map();                            // id -> Promise<city>

// ---------- data loading ----------
async function fetchGz(url) {
  const r = await fetch(url); if (!r.ok) throw new Error(url + " " + r.status);
  return JSON.parse(await new Response(r.body.pipeThrough(new DecompressionStream("gzip"))).text());
}
function unflat(a, U) { const n = a.length / 2, out = new Float32Array(a.length); let x = 0, y = 0;
  for (let i = 0; i < n; i++) { x += a[2*i]; y += a[2*i+1]; out[2*i] = x / U; out[2*i+1] = y / U; } return out; }
function pathOf(pts, close) { const p = new Path2D(); for (let i = 0; i < pts.length; i += 2) i ? p.lineTo(pts[i], pts[i+1]) : p.moveTo(pts[i], pts[i+1]); if (close) p.closePath(); return p; }

function build(data) {
  const U = data.u, c = { id: data.id, data, world: data.view, home: data.home, date: data.date };
  c.water = new Path2D(); c.parks = new Path2D(); c.roads = [new Path2D(), new Path2D(), new Path2D()];
  for (const r of data.base.water) c.water.addPath(pathOf(unflat(r, U), true));
  for (const r of data.base.parks) c.parks.addPath(pathOf(unflat(r, U), true));
  for (const [k, r] of data.base.roads) c.roads[k].addPath(pathOf(unflat(r, U), false));
  c.shapes = data.shapes.map(([cls, color, flat]) => {
    const pts = unflat(flat, U), n = pts.length / 2, cum = new Float32Array(n);
    for (let i = 1; i < n; i++) cum[i] = cum[i-1] + Math.hypot(pts[2*i] - pts[2*i-2], pts[2*i+1] - pts[2*i-1]);
    let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
    for (let i = 0; i < pts.length; i += 2) { const x = pts[i], y = pts[i+1]; if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
    return { cls, color, pts, cum, n, path: pathOf(pts, false), bb: [x0, y0, x1, y1] };
  });
  const pats = []; { let po = 0;
    for (const n of data.PC) { const sd = new Float32Array(n); let q = 0; for (let i = 0; i < n; i++) { q += data.PD[po + i]; sd[i] = q / U; } pats.push(sd); po += n; } }

  for (let k = 0; k < NV; k++) {
    const off = V[6*k+3], cnt = V[6*k+4], tt = new Int32Array(cnt), dd = new Float32Array(cnt);
    let a = 0, b = 0;
    for (let i = 0; i < cnt; i++) { a += data.T[off+i]; b += data.D[off+i]; tt[i] = a; dd[i] = b / U; }
    c.vs[k] = { shape: c.shapes[V[6*k]], route: V[6*k+1], head: V[6*k+2], pat: pats[V[6*k+5]], t: tt, d: dd, t0: tt[0], t1: tt[cnt-1] };
  }
  c.NV = NV; c.liveList = new Int32Array(NV); c.nList = 0; c.pos = new Float32Array(NV * 2); c.live = new Uint8Array(NV); c.alpha = new Float32Array(NV); c.hd = new Float32Array(NV * 2);
  c.routes = data.routes; c.heads = data.heads;
  const byColor = {};                                 // drawing layer: each corridor once per colour (data.lines), else the shapes themselves
  if (data.lines) for (const [cls, color, flat] of data.lines) (byColor[cls + color] ||= { cls, color, path: new Path2D() }).path.addPath(pathOf(unflat(flat, U), false));
  else for (const s of c.shapes) (byColor[s.cls + s.color] ||= { cls: s.cls, color: s.color, path: new Path2D() }).path.addPath(s.path);
  c.groups = Object.values(byColor).sort((a, b) => a.cls - b.cls);
  c.tMin = Infinity; c.tMax = 0;
  for (const v of c.vs) { c.tMin = Math.min(c.tMin, v.t0); c.tMax = Math.max(c.tMax, v.t1); }
  c.tMin = Math.floor(c.tMin / 900) * 900; c.tMax = Math.ceil(c.tMax / 900) * 900; c.tEnd = Math.max(c.tMax, 86400);
  data.base = data.shapes = data.lines = data.veh = data.T = data.D = data.PC = data.PD = null;   // free the raw arrays
  return c;
}
function loadCity(id) {
  if (!cache.has(id)) cache.set(id, fetchGz(`data/${id}.bin`).then(build).catch(e => { cache.delete(id); throw e; }));
  return cache.get(id);
}

// ---------- tabs ----------
function fmtDate(d) { if (!d) return ""; const dt = new Date(+d.slice(0, 4), +d.slice(4, 6) - 1, +d.slice(6, 8));
  return dt.toLocaleDateString("en-US", dt.getFullYear() === new Date().getFullYear() ? { weekday: "long", month: "short", day: "numeric" }
    : { weekday: "long", month: "short", day: "numeric", year: "numeric" }); }
function fmtShort(d) { const dt = new Date(+d.slice(0, 4), +d.slice(4, 6) - 1, +d.slice(6, 8)); return dt.toLocaleDateString("en-US", dt.getFullYear() === new Date().getFullYear() ? { month: "short", day: "numeric" } : { month: "short", day: "numeric", year: "numeric" }); }
async function select(id, replace) {

  const token = ++loadToken;
  document.querySelectorAll("#tabs button, #menu button").forEach(b => b.setAttribute("aria-selected", b.dataset.id === id));
  $("tabs").querySelector('[aria-selected="true"]')?.scrollIntoView({ inline: "center", block: "nearest", behavior: "smooth" });
  if (replace) history.replaceState(null, "", "#" + id); else location.hash = id;
  document.title = m.name + " · City Transit Map";
  $("cname").textContent = m.name; $("csub").textContent = m.sub; $("cdate").textContent = "";
  $("credit").textContent = m.credit ? "data: " + m.credit : "open GTFS timetables";
  const ready = cache.has(id) && C && C.id === id;
  if (!ready) { $("loadmsg").textContent = "Loading " + m.name + "…"; $("loading").classList.add("on"); }
  let c;
  try { c = await loadCity(id); } catch (e) { $("loadmsg").textContent = "Couldn't load " + m.name + ": " + e.message; return; }
  if (token !== loadToken) return;                    // user already moved on
  $("loading").classList.remove("on");

  $("cdate").textContent = (uniq.length > 1
    ? "Timetables: " + Object.entries(ds).map(([k, v]) => k + " " + fmtShort(v)).join(", ")
    : fmtDate(c.date) + " timetable");

  // first load: the city's current local time. After that the clock just keeps running: switching tabs does not move it.
  let start = curTz === null ? nowIn(m.tz) : t;

  if (start < c.tMin && start + 86400 <= c.tMax) start += 86400;        // after midnight: late-night trips run past 24:00

}
function makeTabs() {
  const nav = $("tabs"), menu = $("menu");
  for (const m of manifest) {
    const b = document.createElement("button"); b.textContent = m.name; b.dataset.id = m.id; b.setAttribute("role", "tab");
    b.addEventListener("click", () => select(m.id));
    b.addEventListener("pointerenter", () => loadCity(m.id).catch(() => {}));   // warm the cache
    nav.appendChild(b);
    const mi = document.createElement("button"); mi.dataset.id = m.id; mi.setAttribute("role", "menuitem");
    mi.innerHTML = `<b></b><small></small>`; mi.firstChild.textContent = m.name; mi.lastChild.textContent = m.sub || "";
    mi.addEventListener("click", () => { select(m.id); closeMenu(); });
    mi.addEventListener("pointerenter", () => loadCity(m.id).catch(() => {}));
    menu.appendChild(mi);
  }
  const upd = () => { $("navL").style.visibility = nav.scrollLeft > 4 ? "visible" : "hidden";
    $("navR").style.visibility = nav.scrollLeft + nav.clientWidth < nav.scrollWidth - 4 ? "visible" : "hidden"; };

  nav.addEventListener("wheel", e => { if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) { nav.scrollLeft += e.deltaY; e.preventDefault(); } }, { passive: false });

  const x = C.pos[2*k] * view.s + view.x, y = C.pos[2*k+1] * view.s + view.y;
  tip.style.left = Math.max(8, Math.min(vw - tip.offsetWidth - 8, x + 14)) + "px"; tip.style.top = Math.max(60, y - tip.offsetHeight - 10) + "px";
}

// ---------- loop ----------
let last = performance.now(), countAt = 0;

  if (innerWidth !== vw || innerHeight !== vh) onResize();

  if (playing && C) { t += dt * speed;

    setTime(t, false); }

    const f = view.s / stView.s; ctx.fillStyle = "#1e1e21"; ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.setTransform(f, 0, 0, f, dpr * (view.x - f * stView.x), dpr * (view.y - f * stView.y)); ctx.drawImage(st, 0, 0); ctx.setTransform(1, 0, 0, 1, 0, 0);
  } else ctx.drawImage(st, 0, 0);

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

(async () => {
  try { manifest = await (await fetch("data/cities.json")).json(); }
  catch (e) { $("loading").classList.add("on"); $("loadmsg").textContent = "Couldn't load data/cities.json. Serve this folder over http (e.g. python3 -m http.server)."; return; }
