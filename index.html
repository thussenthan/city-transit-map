<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>City Transit Map</title>
<meta name="description" content="Every scheduled bus, train and tram in a city, animated from the open GTFS timetable.">
<style>
  :root { --bg:#1e1e21; --fg:#fff; --dim:rgba(255,255,255,.62); --faint:rgba(255,255,255,.4);
          --panel:rgba(24,24,27,.84); --line:rgba(255,255,255,.14); --accent:#0097d6; --tabs:46px; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg); overflow:hidden;
              font:14px/1.35 -apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif;
              -webkit-user-select:none; user-select:none; overscroll-behavior:none; }
  canvas { position:fixed; inset:0; width:100%; height:100%; touch-action:none; cursor:grab; display:block; }
  canvas.drag { cursor:grabbing; }
  nav { position:fixed; top:0; left:0; right:0; height:calc(var(--tabs) + env(safe-area-inset-top)); padding-top:env(safe-area-inset-top);
        display:flex; gap:4px; align-items:center; overflow-x:auto; scrollbar-width:none; z-index:6;
        padding-left:max(10px,env(safe-area-inset-left)); padding-right:10px;
        background:linear-gradient(rgba(20,20,22,.92),rgba(20,20,22,.7)); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
        border-bottom:1px solid var(--line); }
  nav::-webkit-scrollbar { display:none; }
  nav button { flex:none; background:none; border:0; color:var(--dim); padding:7px 13px; border-radius:99px; font:inherit; font-weight:500; cursor:pointer; white-space:nowrap; }
  nav button:hover { color:var(--fg); background:rgba(255,255,255,.08); }
  nav button[aria-selected=true] { color:#111; background:#fff; }
  .title { position:fixed; left:max(16px,env(safe-area-inset-left)); top:calc(var(--tabs) + env(safe-area-inset-top) + 12px); pointer-events:none;
           text-shadow:0 1px 12px rgba(0,0,0,.75); max-width:62vw; }
  .title h1 { margin:0; font-weight:600; font-size:clamp(28px,5.5vw,48px); letter-spacing:-.02em; line-height:1.02; }
  .title .s1 { font-size:clamp(14px,2.2vw,19px); color:var(--dim); margin-top:6px; }
  .title .s2 { font-size:12px; color:var(--faint); margin-top:3px; }
  .clock { position:fixed; right:max(16px,env(safe-area-inset-right)); top:calc(var(--tabs) + env(safe-area-inset-top) + 12px); text-align:right;
           pointer-events:none; text-shadow:0 1px 12px rgba(0,0,0,.75); }
  .clock .t { font-size:clamp(28px,5vw,42px); font-variant-numeric:tabular-nums; font-weight:500; line-height:1; }
  .clock .n { font-size:13px; color:var(--dim); margin-top:6px; font-variant-numeric:tabular-nums; }
  .panel { position:fixed; left:50%; transform:translateX(-50%); bottom:max(26px,calc(env(safe-area-inset-bottom) + 14px));
           width:min(760px,calc(100vw - 24px)); background:var(--panel); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
           border:1px solid var(--line); border-radius:14px; padding:10px 12px; display:grid; gap:9px; }
  .row { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  button, select { font:inherit; color:var(--fg); background:rgba(255,255,255,.08); border:1px solid var(--line); border-radius:9px; padding:6px 11px; cursor:pointer; }
  button:hover, select:hover { background:rgba(255,255,255,.14); }
  button:focus-visible, select:focus-visible, input:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  #play { width:42px; height:34px; padding:0; font-size:15px; }
  input[type=range] { flex:1; min-width:120px; accent-color:var(--accent); height:28px; }
  .chip { display:inline-flex; align-items:center; gap:7px; padding:5px 11px 5px 9px; border-radius:99px; font-size:13px; }
  .chip[aria-pressed=false] { opacity:.45; }
  .chip i { width:14px; height:4px; border-radius:2px; display:inline-block; }
  label.loop { display:inline-flex; align-items:center; gap:6px; color:var(--dim); font-size:13px; cursor:pointer; }
  label.loop input { accent-color:var(--accent); }
  .spacer { flex:1; }
  .tip { position:fixed; pointer-events:none; background:rgba(12,12,14,.93); border:1px solid var(--line); border-radius:9px; padding:7px 10px;
         font-size:13px; max-width:260px; display:none; z-index:5; }
  .tip b { display:inline-block; min-width:1.6em; padding:1px 6px; border-radius:5px; margin-right:6px; color:#fff; text-align:center; }
  .tip small { display:block; color:var(--dim); margin-top:3px; }
  .foot { position:fixed; left:0; right:0; bottom:max(5px,env(safe-area-inset-bottom)); text-align:center; font-size:11px; color:var(--faint); pointer-events:none; padding:0 8px; }
  .foot a { color:inherit; pointer-events:auto; }
  .zoom { position:fixed; right:max(14px,env(safe-area-inset-right)); top:50%; transform:translateY(-50%); display:grid; gap:6px; }
  .zoom button { width:38px; height:38px; padding:0; font-size:20px; background:var(--panel); }
  #loading { position:fixed; inset:0; display:none; place-items:center; background:rgba(30,30,33,.72); z-index:4; color:var(--dim); font-size:16px; pointer-events:none; }
  #loading.on { display:grid; }
  #loading span::before { content:""; display:inline-block; width:14px; height:14px; margin-right:10px; vertical-align:-2px; border-radius:50%;
                          border:2px solid var(--faint); border-top-color:#fff; animation:spin .8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  @media (max-width:560px) { .zoom { display:none; } .title .s2 { display:none; } }
</style>
</head>
<body>
<canvas id="map" aria-label="Animated map of every scheduled vehicle in the selected city"></canvas>
<nav id="tabs" role="tablist" aria-label="Cities"></nav>
<div class="title"><h1 id="cname">&nbsp;</h1><div class="s1" id="csub"></div><div class="s2" id="cdate"></div></div>
<div class="clock"><div class="t" id="clock">08:00</div><div class="n" id="count"></div></div>
<div class="zoom"><button id="zin" aria-label="Zoom in">+</button><button id="zout" aria-label="Zoom out">−</button>
  <button id="zhome" aria-label="Reset view" style="font-size:15px">⌂</button></div>
<div class="tip" id="tip"></div>
<div class="panel">
  <div class="row">
    <button id="play" aria-label="Play or pause">❚❚</button>
    <input id="time" type="range" min="0" max="1" step="1" aria-label="Time of day">
    <select id="speed" aria-label="Playback speed">
      <option value="1">1×</option><option value="10">10×</option><option value="60">60×</option>
      <option value="120" selected>120×</option><option value="300">300×</option><option value="900">900×</option>
    </select>
  </div>
  <div class="row">
    <button class="chip" data-cls="1" aria-pressed="true"><i style="background:linear-gradient(90deg,#fff 0 33%,#bbb 33% 66%,#888 66%)"></i>Metro &amp; tram</button>
    <button class="chip" data-cls="2" aria-pressed="true"><i style="background:#46e1c8"></i>Regional rail</button>
    <button class="chip" data-cls="0" aria-pressed="true"><i style="background:#6096eb"></i>Bus</button>
  </div>
</div>
<div id="loading"><span id="loadmsg">Loading…</span></div>
<div class="foot">basemap © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap contributors</a>, Overture Maps · <span id="credit">open GTFS timetables</span></div>

<script>
(() => {
const $ = id => document.getElementById(id);
const cv = $("map"), ctx = cv.getContext("2d");
const st = document.createElement("canvas"), sctx = st.getContext("2d");
let dpr = 1, vw = 0, vh = 0;
const view = { s: 1, x: 0, y: 0 };
const show = { 0: true, 1: true, 2: true };
let t = 8 * 3600, loopStart = t, playing = true, speed = 120, loop = false;
let staticDirty = true, hover = -1, selected = -1, mouse = null;
let C = null;                                       // current city
let manifest = [], loadToken = 0;
const cache = new Map();                            // id -> Promise<city>

// ---------- data loading ----------
async function fetchGz(url) {
  const r = await fetch(url); if (!r.ok) throw new Error(url + " " + r.status);
  return JSON.parse(await new Response(r.body.pipeThrough(new DecompressionStream("gzip"))).text());
}
function unflat(a, U) { const n = a.length / 2, out = new Float32Array(a.length); let x = 0, y = 0;
  for (let i = 0; i < n; i++) { x += a[2*i]; y += a[2*i+1]; out[2*i] = x / U; out[2*i+1] = y / U; } return out; }
function pathOf(pts, close) { const p = new Path2D(); for (let i = 0; i < pts.length; i += 2) i ? p.lineTo(pts[i], pts[i+1]) : p.moveTo(pts[i], pts[i+1]); if (close) p.closePath(); return p; }

function build(data) {
  const U = data.u, c = { id: data.id, data, world: data.view, home: data.home, date: data.date };
  c.water = new Path2D(); c.parks = new Path2D(); c.roads = [new Path2D(), new Path2D(), new Path2D()];
  for (const r of data.base.water) c.water.addPath(pathOf(unflat(r, U), true));
  for (const r of data.base.parks) c.parks.addPath(pathOf(unflat(r, U), true));
  for (const [k, r] of data.base.roads) c.roads[k].addPath(pathOf(unflat(r, U), false));
  c.shapes = data.shapes.map(([cls, color, flat]) => {
    const pts = unflat(flat, U), n = pts.length / 2, cum = new Float32Array(n);
    for (let i = 1; i < n; i++) cum[i] = cum[i-1] + Math.hypot(pts[2*i] - pts[2*i-2], pts[2*i+1] - pts[2*i-1]);
    return { cls, color, pts, cum, n, path: pathOf(pts, false) };
  });
  const V = data.veh, NV = V.length / 5; c.vs = new Array(NV);
  for (let k = 0; k < NV; k++) {
    const off = V[5*k+3], cnt = V[5*k+4], tt = new Int32Array(cnt), dd = new Float32Array(cnt);
    let a = 0, b = 0;
    for (let i = 0; i < cnt; i++) { a += data.T[off+i]; b += data.D[off+i]; tt[i] = a; dd[i] = b / U; }
    c.vs[k] = { shape: c.shapes[V[5*k]], route: V[5*k+1], head: V[5*k+2], t: tt, d: dd, t0: tt[0], t1: tt[cnt-1] };
  }
  c.NV = NV; c.pos = new Float32Array(NV * 2); c.live = new Uint8Array(NV);
  c.routes = data.routes; c.heads = data.heads;
  const byColor = {};
  for (const s of c.shapes) (byColor[s.cls + s.color] ||= { cls: s.cls, color: s.color, path: new Path2D() }).path.addPath(s.path);
  c.groups = Object.values(byColor).sort((a, b) => a.cls - b.cls);
  c.tMin = Infinity; c.tMax = 0;
  for (const v of c.vs) { c.tMin = Math.min(c.tMin, v.t0); c.tMax = Math.max(c.tMax, v.t1); }
  c.tMin = Math.floor(c.tMin / 900) * 900; c.tMax = Math.ceil(c.tMax / 900) * 900;
  data.base = data.shapes = data.veh = data.T = data.D = null;   // free the raw arrays
  return c;
}
function loadCity(id) {
  if (!cache.has(id)) cache.set(id, fetchGz(`data/${id}.bin`).then(build).catch(e => { cache.delete(id); throw e; }));
  return cache.get(id);
}

// ---------- tabs ----------
function fmtDate(d) { if (!d) return ""; const dt = new Date(+d.slice(0, 4), +d.slice(4, 6) - 1, +d.slice(6, 8));
  return dt.toLocaleDateString("en-US", { weekday: "long", month: "short", day: "numeric" }); }
function fmtShort(d) { const dt = new Date(+d.slice(0, 4), +d.slice(4, 6) - 1, +d.slice(6, 8)); return dt.toLocaleDateString("en-US", { month: "short", day: "numeric" }); }
async function select(id, replace) {
  const m = manifest.find(x => x.id === id) || manifest[0]; id = m.id;
  const token = ++loadToken;
  document.querySelectorAll("nav button").forEach(b => b.setAttribute("aria-selected", b.dataset.id === id));
  if (replace) history.replaceState(null, "", "#" + id); else location.hash = id;
  document.title = m.name + " · City Transit Map";
  $("cname").textContent = m.name; $("csub").textContent = m.sub; $("cdate").textContent = "";
  $("credit").textContent = m.credit ? "data: " + m.credit : "open GTFS timetables";
  const ready = cache.has(id) && C && C.id === id;
  if (!ready) { $("loadmsg").textContent = "Loading " + m.name + "…"; $("loading").classList.add("on"); }
  let c;
  try { c = await loadCity(id); } catch (e) { $("loadmsg").textContent = "Couldn't load " + m.name + ": " + e.message; return; }
  if (token !== loadToken) return;                    // user already moved on
  $("loading").classList.remove("on");
  C = c; selected = hover = -1;
  const ds = c.data.dates || {}, uniq = [...new Set(Object.values(ds))];
  $("cdate").textContent = (uniq.length > 1
    ? "Timetables: " + Object.entries(ds).map(([k, v]) => k + " " + fmtShort(v)).join(", ")
    : fmtDate(c.date) + " timetable");
  timeEl.min = c.tMin; timeEl.max = c.tMax;
  if (t < c.tMin || t > c.tMax) setTime(Math.min(Math.max(t, c.tMin), c.tMax), true); else timeEl.value = t;
  homeView(); staticDirty = true;
}
function makeTabs() {
  const nav = $("tabs");
  for (const m of manifest) {
    const b = document.createElement("button"); b.textContent = m.name; b.dataset.id = m.id; b.setAttribute("role", "tab");
    b.addEventListener("click", () => select(m.id));
    b.addEventListener("pointerenter", () => loadCity(m.id).catch(() => {}));   // warm the cache
    nav.appendChild(b);
  }
}
addEventListener("hashchange", () => { const id = location.hash.slice(1); if (id && (!C || id !== C.id)) select(id, true); });
addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT") { if (e.target.type === "range" && e.key.startsWith("Arrow")) return; }
  const i = manifest.findIndex(m => m.id === C?.id);
  if (e.key === "]") select(manifest[(i + 1) % manifest.length].id);
  else if (e.key === "[") select(manifest[(i - 1 + manifest.length) % manifest.length].id);
  else if (e.code === "Space") { e.preventDefault(); $("play").click(); }
  else if (e.key === "+" || e.key === "=") zoomAt(vw/2, vh/2, 1.4); else if (e.key === "-") zoomAt(vw/2, vh/2, 1/1.4);
  else if (e.key === "Escape") selected = -1;
});

// ---------- view ----------
function homeView() {
  const h = C?.home; if (!h || !vw) return;
  const top = 150, bottom = 150;                       // leave room for header and controls
  view.s = Math.min(vw / h.w, Math.max(200, vh - top - bottom) / h.h, 40);
  view.x = vw / 2 - h.cx * view.s; view.y = (top + (vh - top - bottom) / 2) - h.cy * view.s;
  staticDirty = true;
}
function clampView() {
  if (!C) return;
  const w = C.world, cx = (vw/2 - view.x) / view.s, cy = (vh/2 - view.y) / view.s;
  const nx = Math.min(w.w, Math.max(0, cx)), ny = Math.min(w.h, Math.max(0, cy));
  if (nx !== cx) view.x = vw/2 - nx * view.s; if (ny !== cy) view.y = vh/2 - ny * view.s;
}
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2); vw = innerWidth; vh = innerHeight;
  for (const c of [cv, st]) { c.width = Math.round(vw * dpr); c.height = Math.round(vh * dpr); }
  staticDirty = true;
}
let first = true;
function onResize() {
  if (!innerWidth || !innerHeight) return;
  const had = vw > 0, cx = (vw/2 - view.x) / view.s, cy = (vh/2 - view.y) / view.s;
  resize();
  if (!had || first) { homeView(); first = !C; } else { view.x = vw/2 - cx * view.s; view.y = vh/2 - cy * view.s; }
}
addEventListener("resize", onResize); onResize();

// ---------- static layer ----------
function drawStatic() {
  const s = view.s, c = sctx;
  c.setTransform(1, 0, 0, 1, 0, 0); c.fillStyle = "#1e1e21"; c.fillRect(0, 0, st.width, st.height);
  staticDirty = false; if (!C) return;
  c.setTransform(dpr*s, 0, 0, dpr*s, dpr*view.x, dpr*view.y);
  c.lineJoin = "round"; c.lineCap = "round";
  const px = 1 / s, zf = Math.min(2.2, Math.max(0.8, Math.sqrt(s)));
  c.fillStyle = "#222623"; c.fill(C.parks);
  c.strokeStyle = "#2b2b2f"; c.lineWidth = 1.0 * zf * px; c.stroke(C.roads[2]);
  c.strokeStyle = "#343439"; c.lineWidth = 1.4 * zf * px; c.stroke(C.roads[1]);
  c.strokeStyle = "#3e3e44"; c.lineWidth = 2.0 * zf * px; c.stroke(C.roads[0]);
  c.fillStyle = "#0b0b0d"; c.fill(C.water, "evenodd");
  for (const g of C.groups) {
    if (!show[g.cls]) continue;
    if (g.cls === 0) { c.strokeStyle = "rgba(96,150,235,.6)"; c.lineWidth = 1.1 * zf * px; }
    else if (g.cls === 2) { c.strokeStyle = "rgba(70,225,200,.85)"; c.lineWidth = 1.7 * zf * px; }
    else { c.strokeStyle = "#" + g.color; c.lineWidth = 2.1 * zf * px; }
    c.stroke(g.path);
  }
}

// ---------- vehicles ----------
function locate(v, tt) {
  const ts = v.t; let lo = 0, hi = ts.length - 1;
  while (hi - lo > 1) { const m = (lo + hi) >> 1; if (ts[m] <= tt) lo = m; else hi = m; }
  const span = ts[hi] - ts[lo], f = span > 0 ? (tt - ts[lo]) / span : 0;
  const d = v.d[lo] + (v.d[hi] - v.d[lo]) * f, sh = v.shape, cum = sh.cum;
  let a = 0, b = sh.n - 1;
  while (b - a > 1) { const m = (a + b) >> 1; if (cum[m] <= d) a = m; else b = m; }
  const seg = cum[b] - cum[a], g = seg > 0 ? Math.min(1, Math.max(0, (d - cum[a]) / seg)) : 0;
  return [sh.pts[2*a] + (sh.pts[2*b] - sh.pts[2*a]) * g, sh.pts[2*a+1] + (sh.pts[2*b+1] - sh.pts[2*a+1]) * g];
}
let nLive = 0;
function updateVehicles() {
  nLive = 0; if (!C) return;
  const { vs, pos, live, NV } = C;
  for (let k = 0; k < NV; k++) {
    const v = vs[k];
    if (t < v.t0 || t > v.t1 || !show[v.shape.cls]) { live[k] = 0; continue; }
    const p = locate(v, t); pos[2*k] = p[0]; pos[2*k+1] = p[1]; live[k] = 1; nLive++;
  }
}
function drawDots() {
  if (!C) return;
  const { vs, pos, live, NV } = C, s = view.s, zf = Math.min(2.4, Math.max(0.85, Math.pow(s, 0.45)));
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (selected >= 0 && live[selected]) {
    ctx.save(); ctx.setTransform(dpr*s, 0, 0, dpr*s, dpr*view.x, dpr*view.y);
    ctx.strokeStyle = "rgba(255,255,255,.9)"; ctx.lineWidth = 2.4 / s; ctx.lineJoin = "round"; ctx.stroke(vs[selected].shape.path); ctx.restore();
  }
  for (const pass of [0, 1]) {
    for (let k = 0; k < NV; k++) {
      if (!live[k]) continue;
      const big = vs[k].shape.cls > 0; if ((pass === 1) !== big) continue;
      const x = pos[2*k] * s + view.x, y = pos[2*k+1] * s + view.y;
      if (x < -10 || y < -10 || x > vw + 10 || y > vh + 10) continue;
      const r = (big ? 2.6 : 1.7) * zf;
      if (big) { ctx.fillStyle = "rgba(255,255,255,.16)"; ctx.beginPath(); ctx.arc(x, y, r * 2, 0, 6.2832); ctx.fill(); }
      ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.fill();
    }
  }
  for (const k of [hover, selected]) if (k >= 0 && live[k]) {
    ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(pos[2*k] * s + view.x, pos[2*k+1] * s + view.y, 8, 0, 6.2832); ctx.stroke(); }
}

// ---------- UI ----------
const fmt = tt => { const m = Math.floor(tt / 60) % 1440; return String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0"); };
const timeEl = $("time"); timeEl.step = 30;
function setTime(v, userSet) { t = v; if (userSet) loopStart = v; timeEl.value = t; $("clock").textContent = fmt(t); }
timeEl.addEventListener("input", () => setTime(+timeEl.value, true));
$("play").addEventListener("click", () => { playing = !playing; $("play").textContent = playing ? "❚❚" : "▶"; });
$("speed").addEventListener("change", e => speed = +e.target.value);
document.querySelectorAll(".chip").forEach(b => b.addEventListener("click", () => {
  const c = +b.dataset.cls; show[c] = !show[c]; b.setAttribute("aria-pressed", show[c]); staticDirty = true;
  if (selected >= 0 && !show[C.vs[selected].shape.cls]) selected = -1; }));

function zoomAt(px, py, f) {
  const ns = Math.min(40, Math.max(0.12, view.s * f)); f = ns / view.s;
  view.x = px - (px - view.x) * f; view.y = py - (py - view.y) * f; view.s = ns; clampView(); staticDirty = true;
}
$("zin").onclick = () => zoomAt(vw/2, vh/2, 1.5); $("zout").onclick = () => zoomAt(vw/2, vh/2, 1/1.5); $("zhome").onclick = homeView;
cv.addEventListener("wheel", e => { e.preventDefault(); zoomAt(e.clientX, e.clientY, Math.exp(-e.deltaY * (e.ctrlKey ? .01 : .0016))); }, { passive: false });
cv.addEventListener("dblclick", e => zoomAt(e.clientX, e.clientY, 2));
const ptrs = new Map(); let downAt = null, moved = 0, lastPinch = 0;
cv.addEventListener("pointerdown", e => { cv.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, [e.clientX, e.clientY]);
  downAt = [e.clientX, e.clientY]; moved = 0; cv.classList.add("drag"); if (ptrs.size === 2) lastPinch = 0; });
cv.addEventListener("pointermove", e => {
  mouse = [e.clientX, e.clientY];
  if (!ptrs.has(e.pointerId)) return;
  const prev = ptrs.get(e.pointerId); ptrs.set(e.pointerId, [e.clientX, e.clientY]);
  if (ptrs.size === 1) { view.x += e.clientX - prev[0]; view.y += e.clientY - prev[1]; moved += Math.abs(e.clientX - prev[0]) + Math.abs(e.clientY - prev[1]); clampView(); staticDirty = true; }
  else if (ptrs.size === 2) { const [a, b] = [...ptrs.values()], dd = Math.hypot(a[0]-b[0], a[1]-b[1]);
    if (lastPinch) zoomAt((a[0]+b[0])/2, (a[1]+b[1])/2, dd / lastPinch); lastPinch = dd; moved = 99; }
});
const up = e => { ptrs.delete(e.pointerId); cv.classList.remove("drag"); lastPinch = 0;
  if (e.type === "pointerup" && moved < 6 && downAt) { const k = nearest(e.clientX, e.clientY, 16); selected = k === selected ? -1 : k; } };
cv.addEventListener("pointerup", up); cv.addEventListener("pointercancel", up);
cv.addEventListener("pointerleave", () => { mouse = null; });

function nearest(px, py, maxd) {
  if (!C) return -1;
  const { pos, live, vs, NV } = C; let best = -1, bd = maxd * maxd;
  for (let k = 0; k < NV; k++) { if (!live[k]) continue;
    const dx = pos[2*k] * view.s + view.x - px, dy = pos[2*k+1] * view.s + view.y - py, d = dx*dx + dy*dy;
    if (d < bd || (d === bd && vs[k].shape.cls > (vs[best]?.shape.cls ?? -1))) { bd = d; best = k; } }
  return best;
}
const tip = $("tip");
function updateTip() {
  const k = C && selected >= 0 && C.live[selected] ? selected : hover;
  if (!C || k < 0 || !C.live[k]) { tip.style.display = "none"; return; }
  const v = C.vs[k], r = C.routes[v.route], hd = C.heads[v.head], col = v.shape.cls === 0 ? "#4a78c8" : v.shape.cls === 2 ? "#1c9c88" : "#" + v.shape.color;
  const kind = ["Bus", "Metro / tram", "Regional rail"][v.shape.cls];
  const txt = c => c.replace(/[&<>]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[ch]));
  const dark = v.shape.cls === 1 && parseInt(v.shape.color, 16) > 0xb0b0b0;
  tip.innerHTML = `<b style="background:${col};color:${dark ? "#111" : "#fff"}">${txt(String(r[0]).slice(0, 8))}</b>${txt(hd || r[1] || "")}<small>${kind}${r[1] && r[1] !== hd ? " · " + txt(r[1]) : ""}</small>`;
  tip.style.display = "block";
  const x = C.pos[2*k] * view.s + view.x, y = C.pos[2*k+1] * view.s + view.y;
  tip.style.left = Math.max(8, Math.min(vw - tip.offsetWidth - 8, x + 14)) + "px"; tip.style.top = Math.max(60, y - tip.offsetHeight - 10) + "px";
}

// ---------- loop ----------
let last = performance.now(), countAt = 0;
function frame(now) {
  if (innerWidth !== vw || innerHeight !== vh) onResize();
  if (!vw || !st.width) { requestAnimationFrame(frame); return; }
  const w0 = performance.now();
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  if (playing && C) { t += dt * speed;
    if (loop && t > loopStart + 1200) t = loopStart; else if (t > C.tMax) t = C.tMin;
    setTime(t, false); }
  if (staticDirty) drawStatic();
  updateVehicles();
  hover = mouse && !ptrs.size ? nearest(mouse[0], mouse[1], 14) : -1;
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(st, 0, 0);
  drawDots(); updateTip();
  window.__frameMs = (window.__frameMs || 0) * 0.9 + (performance.now() - w0) * 0.1;
  if (now - countAt > 250) { $("count").textContent = C ? nLive.toLocaleString() + " vehicles running" : ""; countAt = now; }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

(async () => {
  try { manifest = await (await fetch("data/cities.json")).json(); }
  catch (e) { $("loading").classList.add("on"); $("loadmsg").textContent = "Couldn't load data/cities.json. Serve this folder over http (e.g. python3 -m http.server)."; return; }
  makeTabs(); setTime(t, true);
  select(location.hash.slice(1) || manifest[0].id, true);
})();
})();
</script>
